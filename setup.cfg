[metadata]
name = personal-ai-productivity-agent
version = 0.1.0
description = A deterministic, local-first daily productivity planner

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    productivity-agent = productivity_agent.cli:main
    productivity-app = productivity_agent.webapp:main

[options.extras_require]
api =
    fastapi
    uvicorn

[options.package_data]
productivity_agent = dashboard.html
